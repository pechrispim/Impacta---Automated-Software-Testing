name: CI Pipeline API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verificar-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar Testes Unitários e de Integração
        run: |
          pytest

      - name: Subir a API e testar requisição (Integração)
        run: |
          # O '&' executa a API em background para não bloquear o Runner
          fastapi run main.py --port 8000 &
          # Aguarda 3 segundos até a API inicializar
          sleep 3
          # -f força a falha no CI caso o status HTTP seja de erro (ex: 404/500)
          curl -f http://localhost:8000/
          curl -f http://localhost:8000/somar/10/20